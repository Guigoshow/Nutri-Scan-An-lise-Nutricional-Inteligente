<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nutri Scan — Protótipo</title>
<style>
  :root {
    --bg: #1c211b;
    --panel: #262d23;
    --leaf: #7fb069;
    --leaf-bright: #9fd587;
    --paper: #f2efe6;
    --muted: #9aa593;
    --line: #3a4234;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--paper);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 32px 28px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--leaf-bright);
    font-weight: 600;
    margin: 0 0 6px;
  }

  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 28px;
    margin: 0 0 8px;
    line-height: 1.15;
  }

  p.sub {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 24px;
    line-height: 1.5;
  }

  .drop {
    border: 1.5px dashed var(--line);
    border-radius: 14px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    position: relative;
  }

  .drop:hover, .drop.dragover {
    border-color: var(--leaf);
    background: rgba(127, 176, 105, 0.06);
  }

  .drop input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .drop-icon { font-size: 26px; margin-bottom: 8px; display: block; }
  .drop-text { font-size: 14px; color: var(--muted); }
  .drop-text strong { color: var(--paper); }

  #preview {
    display: none;
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 12px;
    margin-top: 14px;
  }

  button {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--leaf);
    color: #10140d;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  button:hover:not(:disabled) { background: var(--leaf-bright); }
  button:active:not(:disabled) { transform: scale(0.99); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .result {
    display: none;
    margin-top: 20px;
    padding: 18px;
    background: rgba(127, 176, 105, 0.08);
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.7;
    white-space: pre-wrap;
  }

  .result.show { display: block; }

  .error {
    display: none;
    margin-top: 16px;
    padding: 14px;
    background: rgba(200, 80, 60, 0.1);
    border: 1px solid rgba(200, 80, 60, 0.3);
    border-radius: 10px;
    font-size: 13.5px;
    color: #e8a999;
  }

  .error.show { display: block; }

  .spinner {
    display: none;
    align-items: center;
    gap: 8px;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 14px;
  }

  .spinner.show { display: flex; }

  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--leaf);
    animation: pulse 1s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Protótipo · análise por IA</p>
    <h1>O que está no teu prato?</h1>
    <p class="sub">Envia uma foto da refeição e recebe uma estimativa de calorias e macronutrientes.</p>

    <label class="drop" id="dropZone">
      <input type="file" id="fileInput" accept="image/*" capture="environment" />
      <span class="drop-icon">📷</span>
      <span class="drop-text"><strong>Escolhe uma foto</strong><br>ou arrasta para aqui</span>
    </label>

    <img id="preview" alt="Pré-visualização da refeição" />

    <button id="analyzeBtn" disabled>Analisar refeição</button>

    <div class="spinner" id="spinner">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      a analisar a foto…
    </div>

    <div class="result" id="result"></div>
    <div class="error" id="error"></div>
  </div>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const spinner = document.getElementById('spinner');
  const resultBox = document.getElementById('result');
  const errorBox = document.getElementById('error');

  let base64Image = null;
  let mimeType = null;

  // Função para comprimir a imagem antes de enviar
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Erro ao ler o ficheiro'));
      reader.onload = (event) => {
        const img = new Image();
        img.onerror = () => reject(new Error('Imagem inválida'));
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1024;
            let width = img.width;
            let height = img.height;
            if (width > MAX_WIDTH) {
              height = Math.round((height * MAX_WIDTH) / width);
              width = MAX_WIDTH;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          } catch (err) {
            reject(err);
          }
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) handleFile(file);
  });

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  function handleFile(file) {
    // Mostra preview imediato
    const previewUrl = URL.createObjectURL(file);
    preview.src = previewUrl;
    preview.style.display = 'block';
    analyzeBtn.disabled = true;
    resultBox.classList.remove('show');
    errorBox.classList.remove('show');

    // Comprime a imagem em background
    compressImage(file)
      .then((compressedDataUrl) => {
        base64Image = compressedDataUrl.split(',')[1];
        mimeType = 'image/jpeg';
        analyzeBtn.disabled = false;
      })
      .catch((err) => {
        console.error('Erro na compressão:', err);
        errorBox.textContent = 'Erro ao processar a imagem. Tenta outra foto.';
        errorBox.classList.add('show');
      });
  }

  analyzeBtn.addEventListener('click', async () => {
    if (!base64Image) {
      errorBox.textContent = 'Por favor, escolhe uma foto primeiro.';
      errorBox.classList.add('show');
      return;
    }

    analyzeBtn.disabled = true;
    spinner.classList.add('show');
    resultBox.classList.remove('show');
    errorBox.classList.remove('show');

    try {
      const res = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageBase64: base64Image, mimeType }),
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Erro desconhecido.');
      }

      // Suporta tanto JSON estruturado como texto simples
      if (data.analysis && typeof data.analysis === 'object') {
        const { descricao, calorias, proteinas_g, hidratos_g, gorduras_g } = data.analysis;
        resultBox.innerHTML = `
          <strong>${descricao || 'Refeição não identificada'}</strong><br>
          🔥 ${calorias || 0} kcal<br>
          🥩 Proteínas: ${proteinas_g || 0}g<br>
          🍞 Hidratos: ${hidratos_g || 0}g<br>
          🥑 Gorduras: ${gorduras_g || 0}g
        `;
      } else {
        resultBox.textContent = data.analysis || 'Análise não disponível.';
      }

      resultBox.classList.add('show');
    } catch (err) {
      console.error('Erro na análise:', err);
      errorBox.textContent = err.message || 'Não foi possível analisar a foto.';
      errorBox.classList.add('show');
    } finally {
      spinner.classList.remove('show');
      analyzeBtn.disabled = false;
    }
  });
</script>
</body>
</html>
