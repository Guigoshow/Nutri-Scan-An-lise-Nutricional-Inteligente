<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nutri Scan — Análise Nutricional por IA</title>
<style>
  :root {
    --bg: #0f1410;
    --surface: #1a1f1b;
    --card: #242a26;
    --primary: #7fb069;
    --primary-light: #9fd587;
    --primary-dark: #5a8f4a;
    --text: #f2efe6;
    --text-muted: #8b957e;
    --border: #2d352f;
    --error: #ef4444;
    --error-bg: rgba(239, 68, 68, 0.1);
    --success: #10b981;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    --radius: 16px;
  }

  * { 
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg) 0%, #1a1f1b 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    line-height: 1.6;
  }

  .container {
    width: 100%;
    max-width: 480px;
    animation: fadeIn 0.6s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px;
    box-shadow: var(--shadow);
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .logo {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 32px;
    box-shadow: 0 4px 12px rgba(127, 176, 105, 0.3);
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--primary-light);
    font-weight: 700;
    margin-bottom: 8px;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text);
    line-height: 1.2;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.5;
  }

  .upload-section {
    margin-bottom: 24px;
  }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    background: var(--card);
    position: relative;
    overflow: hidden;
  }

  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--primary);
    background: rgba(127, 176, 105, 0.05);
    transform: translateY(-2px);
  }

  .drop-zone input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .drop-icon {
    font-size: 40px;
    margin-bottom: 12px;
    display: block;
    opacity: 0.8;
  }

  .drop-text {
    font-size: 14px;
    color: var(--text-muted);
  }

  .drop-text strong {
    color: var(--text);
    font-weight: 600;
    display: block;
    margin-bottom: 4px;
  }

  .preview-container {
    margin-top: 20px;
    border-radius: 12px;
    overflow: hidden;
    display: none;
    animation: slideIn 0.4s ease-out;
  }

  .preview-container.show {
    display: block;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #preview {
    width: 100%;
    max-height: 280px;
    object-fit: cover;
    border-radius: 12px;
  }

  .btn {
    width: 100%;
    padding: 16px 24px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 12px rgba(127, 176, 105, 0.3);
    margin-top: 20px;
  }

  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(127, 176, 105, 0.4);
  }

  .btn:active:not(:disabled) {
    transform: translateY(0);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .spinner {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px;
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 20px;
  }

  .spinner.show {
    display: flex;
  }

  .spinner-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary);
    animation: bounce 1.4s infinite ease-in-out;
  }

  .spinner-dot:nth-child(1) { animation-delay: -0.32s; }
  .spinner-dot:nth-child(2) { animation-delay: -0.16s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  .result {
    display: none;
    margin-top: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    animation: slideIn 0.5s ease-out;
  }

  .result.show {
    display: block;
  }

  .result-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    line-height: 1.5;
  }

  .confidence-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    padding: 10px 14px;
    background: var(--surface);
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .confidence-label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .confidence-stars {
    font-size: 14px;
    letter-spacing: 2px;
  }

  .macros-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }

  .macro-item {
    background: var(--surface);
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .macro-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .macro-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }

  .macro-unit {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .calories-highlight {
    background: linear-gradient(135deg, rgba(127, 176, 105, 0.15) 0%, rgba(127, 176, 105, 0.05) 100%);
    border: 1px solid var(--primary);
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    margin-bottom: 16px;
  }

  .calories-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .calories-value {
    font-size: 32px;
    font-weight: 800;
    color: var(--primary-light);
    line-height: 1;
  }

  .calories-unit {
    font-size: 16px;
    color: var(--text-muted);
    margin-left: 4px;
  }

  .calories-percent {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .suggestion-box {
    margin-top: 16px;
    padding: 14px;
    background: rgba(127, 176, 105, 0.08);
    border-left: 3px solid var(--primary);
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
  }

  .suggestion-label {
    font-size: 11px;
    color: var(--primary-light);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
    display: block;
  }

  .error {
    display: none;
    margin-top: 20px;
    padding: 16px;
    background: var(--error-bg);
    border: 1px solid var(--error);
    border-radius: 12px;
    font-size: 14px;
    color: var(--error);
    animation: shake 0.5s ease-in-out;
  }

  .error.show {
    display: block;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .badge {
    display: inline-block;
    padding: 4px 10px;
    background: rgba(127, 176, 105, 0.15);
    border: 1px solid var(--primary);
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    color: var(--primary-light);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }

  .source-badge {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .source-badge.openfoodfacts {
    background: #10b981;
    color: white;
    box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
  }

  .source-badge.ia-validada {
    background: #7fb069;
    color: white;
    box-shadow: 0 2px 8px rgba(127, 176, 105, 0.3);
  }

  .source-badge.ia-estimativa {
    background: #8b957e;
    color: white;
    box-shadow: 0 2px 8px rgba(139, 149, 126, 0.3);
  }

  .product-info {
    background: var(--surface);
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }

  .product-info-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }

  .product-info-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .product-info-brand {
    font-size: 13px;
    color: var(--text-muted);
  }

  .product-info-barcode {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    font-family: 'Courier New', monospace;
    opacity: 0.7;
  }

  @media (max-width: 640px) {
    body {
      padding: 16px;
    }
    
    .card {
      padding: 24px 20px;
    }
    
    h1 {
      font-size: 22px;
    }
    
    .macros-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="logo">🥗</div>
        <div class="eyebrow">Nutri Scan · IA</div>
        <h1>O que está no teu prato?</h1>
        <p class="subtitle">Envia uma foto da refeição e recebe uma estimativa instantânea de calorias e macronutrientes.</p>
      </div>

      <div class="upload-section">
        <div class="drop-zone" id="dropZone">
          <input type="file" id="fileInput" accept="image/*" capture="environment" />
          <span class="drop-icon">📸</span>
          <span class="drop-text">
            <strong>Toca para escolher uma foto</strong>
            ou arrasta para aqui
          </span>
        </div>

        <div class="preview-container" id="previewContainer">
          <img id="preview" alt="Pré-visualização da refeição" />
        </div>
      </div>

      <button class="btn" id="analyzeBtn" disabled>Analisar refeição</button>

      <div class="spinner" id="spinner">
        <div class="spinner-dot"></div>
        <div class="spinner-dot"></div>
        <div class="spinner-dot"></div>
        <span>A analisar a tua refeição...</span>
      </div>

      <div class="error" id="error"></div>

      <div class="result" id="result"></div>
    </div>
  </div>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const previewContainer = document.getElementById('previewContainer');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const spinner = document.getElementById('spinner');
  const resultBox = document.getElementById('result');
  const errorBox = document.getElementById('error');

  let base64Image = null;
  let mimeType = null;

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Erro ao ler o ficheiro'));
      reader.onload = (event) => {
        const img = new Image();
        img.onerror = () => reject(new Error('Imagem inválida'));
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1024;
            let width = img.width;
            let height = img.height;
            if (width > MAX_WIDTH) {
              height = Math.round((height * MAX_WIDTH) / width);
              width = MAX_WIDTH;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          } catch (err) {
            reject(err);
          }
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) handleFile(file);
  });

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  function handleFile(file) {
    const previewUrl = URL.createObjectURL(file);
    preview.src = previewUrl;
    previewContainer.classList.add('show');
    analyzeBtn.disabled = true;
    resultBox.classList.remove('show');
    errorBox.classList.remove('show');

    compressImage(file)
      .then((compressedDataUrl) => {
        base64Image = compressedDataUrl.split(',')[1];
        mimeType = 'image/jpeg';
        analyzeBtn.disabled = false;
      })
      .catch((err) => {
        console.error('Erro na compressão:', err);
        errorBox.textContent = 'Erro ao processar a imagem. Tenta outra foto.';
        errorBox.classList.add('show');
      });
  }

  analyzeBtn.addEventListener('click', async () => {
    if (!base64Image) {
      errorBox.textContent = 'Por favor, escolhe uma foto primeiro.';
      errorBox.classList.add('show');
      return;
    }

    analyzeBtn.disabled = true;
    spinner.classList.add('show');
    resultBox.classList.remove('show');
    errorBox.classList.remove('show');

    try {
      const res = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageBase64: base64Image, mimeType }),
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Erro desconhecido.');
      }

      if (data.analysis && typeof data.analysis === 'object') {
        const { 
          descricao, 
          calorias, 
          proteinas_g, 
          hidratos_g, 
          gorduras_g,
          confianca,
          sugestao,
          fonte_dados,
          produto_oficial,
          tipo
        } = data.analysis;

        // Gera estrelas de confiança
        const estrelasCheias = '⭐'.repeat(confianca || 3);
        const estrelasVazias = '☆'.repeat(5 - (confianca || 3));
        
        // Calcula percentagem do VDR (Valor Diário de Referência)
        const percentagemCal = Math.round((calorias / 2000) * 100);
        const percentagemProt = Math.round((proteinas_g / 50) * 100);
        const percentagemHidr = Math.round((hidratos_g / 260) * 100);
        const percentagemGord = Math.round((gorduras_g / 70) * 100);

        // Badge de fonte de dados
        let sourceBadge = '';
        if (fonte_dados === 'openfoodfacts') {
          sourceBadge = '<div class="source-badge openfoodfacts">✅ Dados Oficiais Open Food Facts</div>';
        } else if (fonte_dados === 'ia_validada') {
          sourceBadge = '<div class="source-badge ia-validada">✓ IA + Base Validada</div>';
        } else {
          sourceBadge = '<div class="source-badge ia-estimativa">🤖 Estimativa IA</div>';
        }

        // Info do produto oficial se existir
        let productInfo = '';
        if (produto_oficial && produto_oficial.nome) {
          productInfo = `
            <div class="product-info">
              <div class="product-info-label">📦 Produto Identificado</div>
              <div class="product-info-name">${produto_oficial.nome}</div>
              ${produto_oficial.marca ? `<div class="product-info-brand">${produto_oficial.marca}</div>` : ''}
              ${produto_oficial.codigoBarras ? `<div class="product-info-barcode">Código: ${produto_oficial.codigoBarras}</div>` : ''}
            </div>
          `;
        }

        resultBox.innerHTML = `
          ${sourceBadge}
          ${productInfo}
          <div class="result-title">${descricao || 'Refeição não identificada'}</div>
          
          <div class="confidence-bar">
            <span class="confidence-label">📊 Confiança:</span>
            <span class="confidence-stars">${estrelasCheias}${estrelasVazias}</span>
          </div>
          
          <div class="calories-highlight">
            <div class="calories-label">Total de Calorias</div>
            <div class="calories-value">${calorias || 0}<span class="calories-unit">kcal</span></div>
            <div class="calories-percent">${percentagemCal}% do VDR diário (2000 kcal)</div>
          </div>
          
          <div class="macros-grid">
            <div class="macro-item">
              <div class="macro-label">🥩 Proteínas</div>
              <div class="macro-value">${proteinas_g || 0}<span class="macro-unit">g</span></div>
              <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">${percentagemProt}% VDR</div>
            </div>
            <div class="macro-item">
              <div class="macro-label">🍞 Hidratos</div>
              <div class="macro-value">${hidratos_g || 0}<span class="macro-unit">g</span></div>
              <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">${percentagemHidr}% VDR</div>
            </div>
            <div class="macro-item">
              <div class="macro-label">🥑 Gorduras</div>
              <div class="macro-value">${gorduras_g || 0}<span class="macro-unit">g</span></div>
              <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">${percentagemGord}% VDR</div>
            </div>
            <div class="macro-item">
              <div class="macro-label">⚡ Energia</div>
              <div class="macro-value">${Math.round((calorias || 0) / 4.184)}<span class="macro-unit">kJ</span></div>
              <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">joules</div>
            </div>
          </div>

          ${sugestao ? `
          <div class="suggestion-box">
            <span class="suggestion-label">💡 Sugestão para próxima refeição</span>
            ${sugestao}
          </div>
          ` : ''}
        `;
      } else {
        resultBox.innerHTML = `<div class="result-title">${data.analysis || 'Análise não disponível.'}</div>`;
      }

      resultBox.classList.add('show');
      resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } catch (err) {
      console.error('Erro na análise:', err);
      errorBox.textContent = err.message || 'Não foi possível analisar a foto. Tenta novamente.';
      errorBox.classList.add('show');
    } finally {
      spinner.classList.remove('show');
      analyzeBtn.disabled = false;
    }
  });
</script>
</body>
</html>
