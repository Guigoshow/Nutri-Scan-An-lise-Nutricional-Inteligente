<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const spinner = document.getElementById('spinner');
  const resultBox = document.getElementById('result');
  const errorBox = document.getElementById('error');

  let base64Image = null;
  let mimeType = null;

  // NOVO: Função para comprimir a imagem antes de enviar
  function compressImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 1024; // Redimensiona para no máximo 1024px
          let width = img.width;
          let height = img.height;
          
          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }
          
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          // Converte para JPEG com 70% de qualidade (reduz de 5-15MB para ~100-300KB)
          resolve(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (file) await handleFile(file);
  });

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', async (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) await handleFile(file);
  });

  // MODIFICADO: Agora comprime a imagem antes de mostrar o preview
  async function handleFile(file) {
    mimeType = 'image/jpeg'; // Força JPEG após compressão
    
    // Mostra preview imediato (sem compressão) para feedback rápido
    const previewUrl = URL.createObjectURL(file);
    preview.src = previewUrl;
    preview.style.display = 'block';
    
    // Comprime em background
    const compressedDataUrl = await compressImage(file);
    base64Image = compressedDataUrl.split(',')[1];
    
    analyzeBtn.disabled = false;
    resultBox.classList.remove('show');
    errorBox.classList.remove('show');
  }

  analyzeBtn.addEventListener('click', async () => {
    if (!base64Image) return;

    analyzeBtn.disabled = true;
    spinner.classList.add('show');
    resultBox.classList.remove('show');
    errorBox.classList.remove('show');

    try {
      const res = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageBase64: base64Image, mimeType }),
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Erro desconhecido.');
      }

      resultBox.textContent = data.analysis;
      resultBox.classList.add('show');
    } catch (err) {
      errorBox.textContent = err.message || 'Não foi possível analisar a foto.';
      errorBox.classList.add('show');
    } finally {
      spinner.classList.remove('show');
      analyzeBtn.disabled = false;
    }
  });
</script>
